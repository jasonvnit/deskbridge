<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-visual">
  <meta name="theme-color" content="#0b0d10">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="robots" content="noindex, nofollow">
  <title>DeskBridge</title>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="stylesheet" href="/static/styles.css">
  <script type="module" src="/static/js/main.js"></script>
</head>
<body class="app-page">
  <div id="stage">
    <canvas id="screen"></canvas>
    <div id="local-cursor" hidden></div>
  </div>

  <div id="pause-overlay" class="pause-overlay" hidden>
    <div class="pause-card" role="dialog" aria-modal="true" aria-labelledby="pause-title">
      <svg class="pause-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
      <h2 id="pause-title">Paused</h2>
      <p class="muted">Remote control was paused while you were away. The Mac is not being streamed or controlled.</p>
      <button type="button" id="btn-resume" class="primary">Resume</button>
    </div>
  </div>

  <div id="status-overlay" class="status-overlay">
    <div class="spinner"></div>
    <p id="status-text">Connecting…</p>
  </div>

  <header id="toolbar" class="toolbar">
    <span id="conn-dot" class="conn-dot" title="Connection"></span>
    <button type="button" id="btn-mode" class="tool" title="Switch between touch and trackpad mode">Touch</button>
    <button type="button" id="btn-keyboard" class="tool" title="Show the on-screen keyboard" aria-label="Keyboard"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="6" width="19" height="12" rx="2"/><path d="M6 10h.01M9.5 10h.01M13 10h.01M16.5 10h.01M7 14h10"/></svg></button>
    <button type="button" id="btn-keys" class="tool" title="Special keys and shortcuts">⌘ Keys</button>
    <button type="button" id="btn-clipboard" class="tool" title="Clipboard">Clip</button>
    <button type="button" id="btn-fit" class="tool" title="Reset zoom">Fit</button>
    <button type="button" id="btn-fullscreen" class="tool" title="Full screen" aria-label="Full screen" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    <button type="button" id="btn-settings" class="tool" title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    <button type="button" id="btn-hide" class="tool" title="Hide toolbar" aria-label="Hide toolbar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></button>
  </header>
  <button type="button" id="btn-show-toolbar" class="toolbar-handle" title="Show toolbar" aria-label="Show toolbar" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>

  <div id="keys-bar" class="keys-bar" hidden>
    <div class="keys-row">
      <button type="button" class="key mod" data-mod="MetaLeft">⌘</button>
      <button type="button" class="key mod" data-mod="ShiftLeft">⇧</button>
      <button type="button" class="key mod" data-mod="AltLeft">⌥</button>
      <button type="button" class="key mod" data-mod="ControlLeft">⌃</button>
      <span class="key-sep"></span>
      <button type="button" class="key" data-key="Escape">esc</button>
      <button type="button" class="key" data-key="Tab">tab</button>
      <button type="button" class="key" data-key="Backspace">⌫</button>
      <button type="button" class="key" data-key="Delete">⌦</button>
      <button type="button" class="key" data-key="Enter">⏎</button>
      <button type="button" class="key" data-key="ArrowLeft">←</button>
      <button type="button" class="key" data-key="ArrowUp">↑</button>
      <button type="button" class="key" data-key="ArrowDown">↓</button>
      <button type="button" class="key" data-key="ArrowRight">→</button>
      <button type="button" class="key" data-key="Home">home</button>
      <button type="button" class="key" data-key="End">end</button>
      <button type="button" class="key" data-key="PageUp">pg↑</button>
      <button type="button" class="key" data-key="PageDown">pg↓</button>
      <span class="key-sep"></span>
      <button type="button" class="key combo" data-combo="MetaLeft+Tab">⌘ tab</button>
      <button type="button" class="key combo" data-combo="MetaLeft+Space">⌘ space</button>
      <button type="button" class="key combo" data-combo="ControlLeft+ArrowUp">Mission</button>
      <button type="button" class="key combo" data-combo="MetaLeft+KeyC">⌘C</button>
      <button type="button" class="key combo" data-combo="MetaLeft+KeyV">⌘V</button>
      <button type="button" class="key combo" data-combo="MetaLeft+KeyX">⌘X</button>
      <button type="button" class="key combo" data-combo="MetaLeft+KeyZ">⌘Z</button>
      <button type="button" class="key combo" data-combo="MetaLeft+ShiftLeft+KeyZ">⌘⇧Z</button>
      <button type="button" class="key combo" data-combo="MetaLeft+KeyA">⌘A</button>
      <button type="button" class="key combo" data-combo="MetaLeft+KeyW">⌘W</button>
      <button type="button" class="key combo" data-combo="MetaLeft+KeyQ">⌘Q</button>
      <button type="button" class="key combo" data-combo="MetaLeft+ShiftLeft+Digit4">⌘⇧4</button>
      <span class="key-sep"></span>
      <button type="button" class="key" data-key="F1">F1</button>
      <button type="button" class="key" data-key="F2">F2</button>
      <button type="button" class="key" data-key="F3">F3</button>
      <button type="button" class="key" data-key="F4">F4</button>
      <button type="button" class="key" data-key="F5">F5</button>
      <button type="button" class="key" data-key="F6">F6</button>
      <button type="button" class="key" data-key="F7">F7</button>
      <button type="button" class="key" data-key="F8">F8</button>
      <button type="button" class="key" data-key="F9">F9</button>
      <button type="button" class="key" data-key="F10">F10</button>
      <button type="button" class="key" data-key="F11">F11</button>
      <button type="button" class="key" data-key="F12">F12</button>
    </div>
  </div>

  <section id="panel-clipboard" class="panel" hidden aria-label="Clipboard">
    <header class="panel-header">
      <h2>Clipboard</h2>
      <button type="button" class="panel-close" data-close="panel-clipboard" aria-label="Close">✕</button>
    </header>

    <div class="panel-section">
      <h3>Send text to the Mac</h3>
      <textarea id="clip-text" rows="4" placeholder="Type or paste text here…" autocapitalize="off" autocorrect="off" spellcheck="false"></textarea>
      <div class="button-row">
        <button type="button" id="clip-set">Copy to Mac</button>
        <button type="button" id="clip-set-paste" class="primary">Paste on Mac</button>
        <button type="button" id="clip-type">Type it</button>
      </div>
    </div>

    <div class="panel-section">
      <h3>Send an image to the Mac</h3>
      <div class="button-row">
        <label class="button file-button">
          Choose image…
          <input type="file" id="clip-image" accept="image/*" hidden>
        </label>
        <button type="button" id="clip-from-device">Paste from this device</button>
      </div>
      <label class="check"><input type="checkbox" id="clip-auto-paste" checked> Paste (⌘V) right after sending</label>
    </div>

    <div class="panel-section">
      <h3>Mac clipboard</h3>
      <div class="button-row">
        <button type="button" id="clip-fetch">Get Mac clipboard</button>
      </div>
      <div id="clip-remote" class="clip-remote" hidden>
        <textarea id="clip-remote-text" rows="4" readonly hidden></textarea>
        <img id="clip-remote-image" alt="Image from the Mac clipboard" hidden>
        <div class="button-row">
          <button type="button" id="clip-remote-copy">Copy to this device</button>
          <a id="clip-remote-save" class="button" download="clipboard.png" hidden>Save image</a>
        </div>
      </div>
    </div>
  </section>

  <section id="panel-settings" class="panel" hidden aria-label="Settings">
    <header class="panel-header">
      <h2>Settings</h2>
      <button type="button" class="panel-close" data-close="panel-settings" aria-label="Close">✕</button>
    </header>

    <div class="panel-section">
      <h3>Picture</h3>
      <label class="field">Quality
        <select id="set-quality">
          <option value="server">Default (from the Mac's .env)</option>
          <option value="low">Low (fast on slow networks)</option>
          <option value="balanced">Balanced</option>
          <option value="high">High</option>
          <option value="max">Max (native resolution)</option>
        </select>
      </label>
      <label class="field">Frame rate <span id="set-fps-value"></span>
        <input type="range" id="set-fps" min="5" max="30" step="1">
      </label>
      <label class="field">Display
        <select id="set-display"></select>
      </label>
    </div>

    <div class="panel-section">
      <h3>Input</h3>
      <label class="field">Mode
        <select id="set-mode">
          <option value="touch">Touch: tap where you want to click</option>
          <option value="trackpad">Trackpad: drag to move the pointer</option>
        </select>
      </label>
      <label class="field">Trackpad speed <span id="set-trackpad-value"></span>
        <input type="range" id="set-trackpad" min="0.5" max="3" step="0.1">
      </label>
      <label class="field">Scroll speed <span id="set-scroll-value"></span>
        <input type="range" id="set-scroll" min="0.5" max="4" step="0.1">
      </label>
      <label class="check"><input type="checkbox" id="set-paste-sync"> ⌘V pastes this device's clipboard on the Mac</label>
      <label class="check"><input type="checkbox" id="set-copy-sync"> ⌘C / ⌘X copies the Mac clipboard to this device</label>
      <label class="check"><input type="checkbox" id="set-pause-on-blur"> Pause when this window loses focus</label>
    </div>

    <div class="panel-section">
      <h3>Status</h3>
      <dl class="stats">
        <dt>Resolution</dt><dd id="stat-resolution">–</dd>
        <dt>Frames/s</dt><dd id="stat-fps">–</dd>
        <dt>Bandwidth</dt><dd id="stat-bandwidth">–</dd>
        <dt>Latency</dt><dd id="stat-latency">–</dd>
      </dl>
    </div>

    <div class="panel-section">
      <div class="button-row">
        <button type="button" id="btn-release">Release stuck keys</button>
        <button type="button" id="btn-logout" class="danger">Sign out</button>
      </div>
    </div>
  </section>

  <textarea id="kbd-sink" class="kbd-sink" aria-hidden="true" tabindex="-1"
    autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false"></textarea>

  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
